<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cbg)"/>
  <!-- Bowl -->
  <ellipse cx="300" cy="220" rx="180" ry="110" fill="#ffffff" stroke="#e65100" stroke-width="4"/>
  <ellipse cx="300" cy="200" rx="160" ry="85" fill="#fff9c4"/>
  <!-- Steamed Rice -->
  <ellipse cx="250" cy="200" rx="90" ry="60" fill="#fafafa"/>
  <!-- Grilled Chicken Strips -->
  <rect x="300" y="165" width="80" height="26" rx="6" fill="#d84315" stroke="#bf360c" stroke-width="2"/>
  <rect x="320" y="195" width="85" height="26" rx="6" fill="#bf360c" stroke="#870000" stroke-width="2"/>
  <rect x="290" y="225" width="75" height="24" rx="6" fill="#d84315" stroke="#bf360c" stroke-width="2"/>
  <!-- Asparagus & Veggies -->
  <rect x="180" y="180" width="60" height="12" rx="4" fill="#388e3c" transform="rotate(-15 180 180)"/>
  <rect x="190" y="200" width="65" height="12" rx="4" fill="#2e7d32" transform="rotate(-10 190 200)"/>
  <circle cx="230" cy="235" r="12" fill="#ff5722"/>
  <!-- Label -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#d84315"/>
  <text x="100" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Chicken Rice Bowl</text>
</svg>
