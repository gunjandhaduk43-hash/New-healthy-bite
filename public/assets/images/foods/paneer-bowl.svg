<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf5ea"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Ceramic Bowl -->
  <ellipse cx="300" cy="220" rx="180" ry="110" fill="url(#bowl)" stroke="#2e7d32" stroke-width="4"/>
  <ellipse cx="300" cy="200" rx="160" ry="85" fill="#8d6e63"/>
  <!-- Brown Rice Base -->
  <ellipse cx="300" cy="200" rx="150" ry="75" fill="#d7ccc8"/>
  <!-- Fresh Greens & Edamame -->
  <circle cx="230" cy="180" r="24" fill="#4caf50"/>
  <circle cx="260" cy="170" r="20" fill="#388e3c"/>
  <circle cx="210" cy="200" r="16" fill="#81c784"/>
  <!-- Paneer Cubes -->
  <rect x="300" y="160" width="38" height="34" rx="4" fill="#fffde7" stroke="#ffd54f" stroke-width="2"/>
  <rect x="340" y="180" width="36" height="32" rx="4" fill="#fffde7" stroke="#ffd54f" stroke-width="2"/>
  <rect x="290" y="200" width="38" height="34" rx="4" fill="#fffde7" stroke="#ffd54f" stroke-width="2"/>
  <rect x="345" y="150" width="34" height="30" rx="4" fill="#fffde7" stroke="#ffd54f" stroke-width="2"/>
  <!-- Cherry Tomatoes & Dressing -->
  <circle cx="250" cy="220" r="12" fill="#e53935"/>
  <circle cx="390" cy="205" r="14" fill="#e53935"/>
  <path d="M 230 190 Q 300 240 370 190" stroke="#f57f17" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Label Badge -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#2e7d32"/>
  <text x="100" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Paneer Protein Bowl</text>
</svg>
