<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="icbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#icbg)"/>
  <!-- Dessert Cup -->
  <path d="M 230 180 L 260 290 Q 300 300 340 290 L 370 180 Z" fill="#ffffff" stroke="#9575cd" stroke-width="3"/>
  <ellipse cx="300" cy="180" rx="70" ry="16" fill="#f5f5f5" stroke="#9575cd" stroke-width="2"/>
  <!-- Stem & Base -->
  <rect x="294" y="295" width="12" height="30" fill="#ffffff" stroke="#9575cd" stroke-width="2"/>
  <ellipse cx="300" cy="328" rx="40" ry="8" fill="#ffffff" stroke="#9575cd" stroke-width="2"/>
  <!-- Scoops of Ice Cream -->
  <!-- Dark Choco scoop -->
  <circle cx="275" cy="160" r="42" fill="#4e342e"/>
  <!-- Vanilla Bean scoop -->
  <circle cx="325" cy="155" r="42" fill="#fffde7" stroke="#fff59d" stroke-width="2"/>
  <!-- Strawberry Compote drizzle -->
  <path d="M 260 130 Q 300 150 340 130" stroke="#d81b60" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="295" cy="120" r="10" fill="#c2185b"/>
  <!-- Label -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#512da8"/>
  <text x="100" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Protein Ice Cream</text>
</svg>
