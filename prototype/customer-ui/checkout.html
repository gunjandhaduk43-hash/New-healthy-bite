<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Greenhouse Kitchen — Checkout</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/customer.css" />
  <link rel="stylesheet" href="assets/css/checkout.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <!-- Header -->
  <div id="site-header-container"></div>

  <main class="app-container">
    <div style="margin-top: var(--space-4);">
      <a href="cart.html" class="btn btn-outline btn-sm">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Cart</span>
      </a>
    </div>

    <div class="checkout-grid">
      <!-- Left Column: Order Form -->
      <div class="checkout-form-col">
        
        <!-- Step 1: Order Type -->
        <div class="checkout-card">
          <h2 class="checkout-card-title">
            <i class="bi bi-geo-alt" style="color: var(--color-primary-green);"></i>
            <span>Order Type</span>
          </h2>
          
          <div class="order-type-tabs">
            <button type="button" class="order-type-btn active" data-type="dine-in">
              <i class="bi bi-cup-hot"></i>
              <span>Dine-In</span>
            </button>
            <button type="button" class="order-type-btn" data-type="takeaway">
              <i class="bi bi-bag-check"></i>
              <span>Takeaway</span>
            </button>
          </div>

          <!-- Visually locked Table context for Dine-In -->
          <div class="table-locked-callout" id="table-context-callout">
            <div class="table-locked-info">
              <i class="bi bi-pin-map-fill"></i>
              <span>Table 12 · Greenhouse Kitchen (Indiranagar)</span>
            </div>
            <span style="font-size: 11px; background: #ffffff; color: var(--color-primary-green); font-weight: 700; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(46,125,50,0.2);">
              LOCKED
            </span>
          </div>
        </div>

        <!-- Step 2: Customer Contact Details -->
        <div class="checkout-card">
          <h2 class="checkout-card-title">
            <i class="bi bi-person" style="color: var(--color-primary-green);"></i>
            <span>Customer Details</span>
          </h2>

          <div class="form-row two-col">
            <div class="form-group">
              <label class="form-label" for="customer-name">Full Name *</label>
              <input type="text" id="customer-name" class="form-control" placeholder="e.g. Rahul Sharma" value="Arjun Mehta" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="customer-phone">Mobile Number *</label>
              <input type="tel" id="customer-phone" class="form-control" placeholder="e.g. 9876543210" value="9876543210" required />
            </div>
          </div>
        </div>

        <!-- Step 3: Payment Method UI (Prototype simulation) -->
        <div class="checkout-card">
          <h2 class="checkout-card-title">
            <i class="bi bi-credit-card" style="color: var(--color-primary-green);"></i>
            <span>Payment Method (Demo Mode)</span>
          </h2>

          <div class="payment-methods-grid">
            <div class="payment-method-card selected" data-method="upi">
              <div class="payment-method-left">
                <i class="bi bi-qr-code-scan payment-method-icon"></i>
                <div>
                  <div class="payment-method-title">UPI Instant Payment</div>
                  <div class="payment-method-desc">Google Pay, PhonePe, Paytm, BHIM</div>
                </div>
              </div>
              <span class="option-card-radio"></span>
            </div>

            <div class="payment-method-card" data-method="card">
              <div class="payment-method-left">
                <i class="bi bi-credit-card-2-front payment-method-icon"></i>
                <div>
                  <div class="payment-method-title">Credit / Debit Card</div>
                  <div class="payment-method-desc">Visa, Mastercard, RuPay cards</div>
                </div>
              </div>
              <span class="option-card-radio"></span>
            </div>

            <div class="payment-method-card" data-method="cash">
              <div class="payment-method-left">
                <i class="bi bi-cash-stack payment-method-icon"></i>
                <div>
                  <div class="payment-method-title">Pay at Counter / Table</div>
                  <div class="payment-method-desc">Cash or Card upon service</div>
                </div>
              </div>
              <span class="option-card-radio"></span>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column: Order Summary -->
      <aside id="checkout-summary-container">
        <!-- Rendered by CheckoutController -->
      </aside>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/nutrition.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/restaurant-header.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      RestaurantHeaderComponent.render("site-header-container");
      CheckoutController.init();
    });
  </script>
</body>
</html>
