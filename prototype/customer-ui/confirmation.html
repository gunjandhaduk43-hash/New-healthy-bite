<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Order Confirmed — Greenhouse Kitchen</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/checkout.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <!-- Header -->
  <div id="site-header-container"></div>

  <main class="app-container">
    <div class="confirmation-container">
      <div class="confirmation-icon-circle">
        <i class="bi bi-check-lg"></i>
      </div>

      <h1 style="font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); color: var(--color-dark-green); margin-bottom: 6px;">
        Order Placed Successfully!
      </h1>

      <p style="font-size: var(--font-size-sm); color: var(--color-secondary-text); margin-bottom: var(--space-2);">
        Your digital table order has been dispatched directly to the kitchen.
      </p>

      <div class="order-token-badge" id="order-token-badge">
        Order #HB1025
      </div>

      <div style="background: var(--color-background); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px; margin: var(--space-4) 0; text-align: left; font-size: var(--font-size-sm);">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <span style="color: var(--color-secondary-text);">Dine-In Location:</span>
          <strong>Table 12 · Indiranagar</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <span style="color: var(--color-secondary-text);">Estimated Service Time:</span>
          <strong>15 - 20 minutes</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--color-secondary-text);">Payment Status:</span>
          <span style="color: var(--color-success); font-weight: 700;">Simulated / Verified</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: var(--space-6);">
        <a href="tracking.html" class="btn btn-primary btn-lg" id="btn-track-order">
          <i class="bi bi-radar"></i>
          <span>Track Live Order Status</span>
        </a>
        <a href="menu.html" class="btn btn-outline">
          <i class="bi bi-arrow-left"></i>
          <span>Back to Menu</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/nutrition.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/components/restaurant-header.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      RestaurantHeaderComponent.render("site-header-container");

      const params = new URLSearchParams(window.location.search);
      const orderNum = params.get("order") || (AppState.getCurrentOrder() ? AppState.getCurrentOrder().orderNumber : "HB1025");
      const badge = document.getElementById("order-token-badge");
      if (badge) {
        badge.textContent = `Order #${orderNum}`;
      }
    });
  </script>
</body>
</html>
