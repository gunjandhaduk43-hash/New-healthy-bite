<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Greenhouse Kitchen — Your Cart</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/customer.css" />
  <link rel="stylesheet" href="assets/css/cart.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <!-- Header -->
  <div id="site-header-container"></div>

  <main class="app-container">
    <div style="margin-top: var(--space-4);">
      <a href="menu.html" class="btn btn-outline btn-sm">
        <i class="bi bi-arrow-left"></i>
        <span>Continue Ordering</span>
      </a>
    </div>

    <!-- Cart Page 2-Column Grid -->
    <div class="cart-page-grid">
      <div id="cart-items-container">
        <!-- Rendered by CartPageController -->
      </div>
      <aside id="cart-summary-container">
        <!-- Rendered by CartPageController -->
      </aside>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="menu.html" class="nav-item">
      <i class="bi bi-book"></i>
      <span>Menu</span>
    </a>
    <a href="menu.html#search-bar-container" class="nav-item">
      <i class="bi bi-search"></i>
      <span>Search</span>
    </a>
    <a href="tracking.html" class="nav-item">
      <i class="bi bi-clock-history"></i>
      <span>Orders</span>
    </a>
    <a href="cart.html" class="nav-item active">
      <i class="bi bi-bag"></i>
      <span>Cart</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/nutrition.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/empty-state.js"></script>
  <script src="assets/js/components/restaurant-header.js"></script>
  <script src="assets/js/components/cart-item.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      RestaurantHeaderComponent.render("site-header-container");
      CartPageController.init();
    });
  </script>
</body>
</html>
