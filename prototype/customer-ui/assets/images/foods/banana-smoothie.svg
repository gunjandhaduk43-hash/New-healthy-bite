<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="smbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </linearGradient>
    <linearGradient id="smoothie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#smbg)"/>
  <!-- Mason Jar -->
  <rect x="230" y="110" width="140" height="200" rx="20" fill="url(#smoothie)" stroke="#ffffff" stroke-width="4"/>
  <!-- Jar Rim -->
  <rect x="240" y="95" width="120" height="20" rx="6" fill="#e0e0e0"/>
  <!-- Handle -->
  <path d="M 370 140 Q 420 180 370 240" stroke="#ffffff" stroke-width="8" fill="none"/>
  <!-- Chia Seeds Specks -->
  <circle cx="260" cy="170" r="2.5" fill="#3e2723"/>
  <circle cx="310" cy="190" r="2" fill="#3e2723"/>
  <circle cx="330" cy="230" r="2.5" fill="#3e2723"/>
  <circle cx="280" cy="250" r="2" fill="#3e2723"/>
  <!-- Green Straw -->
  <line x1="290" y1="40" x2="310" y2="280" stroke="#2e7d32" stroke-width="7" stroke-linecap="round"/>
  <!-- Banana Slice on rim -->
  <circle cx="245" cy="100" r="16" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <!-- Label -->
  <rect x="20" y="20" width="180" height="32" rx="16" fill="#f57f17"/>
  <text x="110" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Banana Protein Smoothie</text>
</svg>
