<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="brnbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#eeeeee"/>
    </linearGradient>
    <linearGradient id="fudge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#271406"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#brnbg)"/>
  <!-- Ceramic Plate -->
  <ellipse cx="300" cy="240" rx="180" ry="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="3"/>
  <!-- Brownie Cube 3D Projection -->
  <polygon points="220,180 320,150 380,190 280,220" fill="#5d4037"/>
  <polygon points="220,180 280,220 280,260 220,220" fill="#3e2723"/>
  <polygon points="280,220 380,190 380,230 280,260" fill="#271406"/>
  <!-- Chocolate Drizzle -->
  <path d="M 230 180 Q 280 190 310 160 Q 340 180 370 200" stroke="#1a0c02" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Almond Flakes -->
  <ellipse cx="270" cy="180" rx="8" ry="4" fill="#fff9c4" transform="rotate(25 270 180)"/>
  <ellipse cx="330" cy="170" rx="9" ry="4" fill="#fff9c4" transform="rotate(-15 330 170)"/>
  <!-- Label -->
  <rect x="20" y="20" width="180" height="32" rx="16" fill="#3e2723"/>
  <text x="110" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Chocolate Protein Brownie</text>
</svg>
