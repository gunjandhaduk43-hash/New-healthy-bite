<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cfbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efebe9"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="40%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cfbg)"/>
  <!-- Glass Cup -->
  <path d="M 230 100 L 250 320 Q 300 330 350 320 L 370 100 Z" fill="url(#coffee)" stroke="#ffffff" stroke-width="4"/>
  <!-- Foam Top -->
  <ellipse cx="300" cy="105" rx="70" ry="18" fill="#ffffff" opacity="0.9"/>
  <!-- Ice Cubes -->
  <rect x="260" y="140" width="35" height="35" rx="6" fill="#ffffff" opacity="0.6"/>
  <rect x="305" y="160" width="38" height="38" rx="6" fill="#ffffff" opacity="0.6"/>
  <rect x="270" y="210" width="34" height="34" rx="6" fill="#ffffff" opacity="0.5"/>
  <!-- Straw -->
  <line x1="330" y1="50" x2="280" y2="280" stroke="#2e7d32" stroke-width="8" stroke-linecap="round"/>
  <!-- Label -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#4e342e"/>
  <text x="100" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Iced Protein Coffee</text>
</svg>
