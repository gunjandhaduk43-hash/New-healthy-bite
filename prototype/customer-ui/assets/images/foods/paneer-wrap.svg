<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#f0f4c3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wbg)"/>
  <!-- Wrap Tortilla -->
  <g transform="translate(140, 100) rotate(15)">
    <rect x="0" y="0" width="280" height="110" rx="40" fill="#ffe0b2" stroke="#d7ccc8" stroke-width="4"/>
    <!-- Grill Marks -->
    <line x1="40" y1="20" x2="60" y2="90" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="20" x2="110" y2="90" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="20" x2="160" y2="90" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="20" x2="210" y2="90" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
    <!-- Stuffing visible at cut end -->
    <ellipse cx="280" cy="55" rx="20" ry="45" fill="#fff9c4"/>
    <circle cx="280" cy="40" r="14" fill="#4caf50"/>
    <circle cx="285" cy="65" r="12" fill="#e53935"/>
    <rect x="270" y="48" width="16" height="14" fill="#fffde7" stroke="#fbc02d"/>
  </g>
  <!-- Label -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#2e7d32"/>
  <text x="100" y="41" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Grilled Paneer Wrap</text>
</svg>
