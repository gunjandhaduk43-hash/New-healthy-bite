<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Greenhouse Kitchen — Digital Menu & Ordering</title>
  <meta name="description" content="Browse fresh, flavorful and nutrition-aware food made to order at Greenhouse Kitchen Indiranagar." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Modular Design System CSS -->
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/customer.css" />
  <link rel="stylesheet" href="assets/css/food-details.css" />
  <link rel="stylesheet" href="assets/css/cart.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>

  <!-- Site Header Container (Rendered by RestaurantHeaderComponent) -->
  <div id="site-header-container"></div>

  <!-- Main Content Container -->
  <main class="app-container">
    
    <!-- Hero Section (Figma: Light Green #EAF5EA) -->
    <section class="hero-section" aria-label="Restaurant Welcome">
      <div class="hero-content">
        <h1 class="hero-title">Fresh food.<br />Clear choices.</h1>
        <p class="hero-subtitle">
          Browse fresh, flavorful and nutrition-aware food made to order with verified macronutrients.
        </p>
        <div class="hero-features">
          <div class="hero-feature-item">
            <i class="bi bi-shield-check"></i>
            <span>100% Macro Accurate</span>
          </div>
          <div class="hero-feature-item">
            <i class="bi bi-patch-check"></i>
            <span>No Artificial Sweeteners</span>
          </div>
          <div class="hero-feature-item">
            <i class="bi bi-flower1"></i>
            <span>Organic Farm Sourced</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Search Bar Container -->
    <div id="search-bar-container"></div>

    <!-- Quick Filter Chips Container -->
    <div id="quick-filters-container"></div>

    <!-- Category Tabs Container -->
    <div id="category-nav-container"></div>

    <!-- 2-Column Main Layout: Left Menu Grid + Right Sticky Cart (Desktop) -->
    <div class="main-layout-grid">
      <div class="menu-content-col">
        <div id="menu-sections-container">
          <!-- Dynamic food categories and cards rendered by MenuController -->
        </div>
      </div>

      <!-- Right Column: Sticky Cart Sidebar (Desktop) -->
      <aside class="cart-sidebar-col" aria-label="Current Cart Order">
        <div id="sidebar-cart-container"></div>
      </aside>
    </div>

  </main>

  <!-- Mobile Floating Sticky Cart Bar -->
  <div id="mobile-floating-cart-container"></div>

  <!-- Mobile Bottom Navigation Bar (Figma: 4 items) -->
  <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="menu.html" class="nav-item active">
      <i class="bi bi-book"></i>
      <span>Menu</span>
    </a>
    <a href="#search-bar-container" class="nav-item" onclick="document.getElementById('global-search-input')?.focus();">
      <i class="bi bi-search"></i>
      <span>Search</span>
    </a>
    <a href="tracking.html" class="nav-item">
      <i class="bi bi-clock-history"></i>
      <span>Orders</span>
    </a>
    <a href="cart.html" class="nav-item">
      <i class="bi bi-bag"></i>
      <span>Cart</span>
    </a>
  </nav>

  <!-- Master Prototype Scripts -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/nutrition.js"></script>
  <script src="assets/js/state.js"></script>

  <!-- Components -->
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/empty-state.js"></script>
  <script src="assets/js/components/loading-state.js"></script>
  <script src="assets/js/components/restaurant-header.js"></script>
  <script src="assets/js/components/search-bar.js"></script>
  <script src="assets/js/components/filter-chip.js"></script>
  <script src="assets/js/components/category-chip.js"></script>
  <script src="assets/js/components/food-card.js"></script>
  <script src="assets/js/components/food-detail-modal.js"></script>
  <script src="assets/js/components/cart-item.js"></script>
  <script src="assets/js/components/cart-preview.js"></script>
  <script src="assets/js/components/nutrition-summary.js"></script>
  <script src="assets/js/components/quantity-control.js"></script>

  <!-- Controllers -->
  <script src="assets/js/search.js"></script>
  <script src="assets/js/filters.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
