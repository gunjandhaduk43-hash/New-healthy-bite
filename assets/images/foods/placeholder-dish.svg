<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0fdf4"/>
            <stop offset="100%" stop-color="#dcfce7"/>
        </linearGradient>
        <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>
        <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14532d" flood-opacity="0.08"/>
        </filter>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="400" height="300" fill="url(#bgGrad)"/>
    
    <!-- Soft Decorative Ring -->
    <circle cx="200" cy="140" r="105" fill="none" stroke="#bbf7d0" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Outer Plate Rim -->
    <circle cx="200" cy="140" r="90" fill="url(#plateGrad)" filter="url(#subtleShadow)"/>
    <circle cx="200" cy="140" r="76" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="200" cy="140" r="68" fill="#fcfdfd"/>
    
    <!-- Plate Cloche / Healthy Leaf Motif -->
    <g transform="translate(160, 100)">
        <!-- Dish Cloche Arch -->
        <path d="M12,42 C12,20 28,14 40,14 C52,14 68,20 68,42 Z" fill="#166534" opacity="0.12"/>
        <path d="M8,44 L72,44" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Center Healthy Leaf -->
        <path d="M40,10 C40,10 52,20 48,34 C44,38 36,40 32,36 C28,32 30,22 40,10 Z" fill="#16a34a"/>
        <path d="M40,14 C38,24 35,32 32,36" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Cutlery Accents -->
        <path d="M-6,22 L-6,44 M-10,22 L-2,22 M-10,22 L-10,28 C-10,32 -6,34 -6,36 L-6,44 M-2,22 L-2,28 C-2,32 -6,34 -6,36" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M86,22 L86,44 M86,22 C90,24 90,32 86,34 L86,44" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Brand Label -->
    <text x="200" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#166534" letter-spacing="0.5">HEALTHY BITE</text>
    <text x="200" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Fresh Kitchen Preparation</text>
</svg>
